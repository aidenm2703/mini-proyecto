<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notificaciones | AAA Software</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="styles.css"></head>
<body><main class="standalone-page"><header class="standalone-header"><img src="assets/aaa-software-logo.jpeg" alt="AAA Software"><div><p class="eyebrow">AAA SOFTWARE</p><h1>Centro de notificaciones</h1><p>Actividad y avisos relevantes del sistema.</p></div><a class="btn-action btn-action--secondary" href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver</a></header><section class="panel"><div class="panel__header"><h2 class="panel__title"><i class="fa-solid fa-bell"></i> Notificaciones</h2></div><div class="panel__body"><div id="notificationsPageList" class="notifications-page-list"></div></div></section></main><script>const defaults=[['fa-list-check','Tareas pendientes','Revise las tareas asignadas al personal.'],['fa-boxes-stacked','Inventario','Hay productos con stock bajo.'],['fa-shield-halved','Seguridad','El acceso está protegido y monitoreado.']];const updates=JSON.parse(localStorage.getItem('aaa_task_notifications')||'[]').map(x=>[x.done?'fa-circle-check':'fa-rotate-left',x.done?'Tarea completada':'Tarea reabierta',`${x.employee}: ${x.title}`]);const alerts=JSON.parse(localStorage.getItem('aaa_security_alerts')||'[]').map(x=>['fa-triangle-exclamation','Intento de acceso',`${x.attemptedUser} intentó ingresar a las ${x.time}.`]);const items=[...updates,...alerts,...defaults];document.getElementById('notificationsPageList').innerHTML=items.map(([icon,title,text])=>`<article class="notification-page-item"><i class="fa-solid ${icon}"></i><div><h2>${title}</h2><p>${text}</p></div></article>`).join('');</script></body></html>
