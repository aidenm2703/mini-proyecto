<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calendario laboral | AAA Software</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="styles.css"></head>
<body><main class="standalone-page"><header class="standalone-header"><img src="assets/aaa-software-logo.jpeg" alt="AAA Software"><div><p class="eyebrow">PORTAL DEL COLABORADOR</p><h1>Calendario laboral</h1><p>Agosto 2026 · Jornada y días especiales.</p></div><a class="btn-action btn-action--secondary" href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver</a></header><section class="panel"><div class="panel__body"><div class="calendar-legend"><span><b class="legend-dot legend-dot--work"></b>Día laboral</span><span><b class="legend-dot legend-dot--free"></b>Día libre</span><span><b class="legend-dot legend-dot--double"></b>Pago doble</span></div><div class="work-calendar" id="calendar"></div></div></section></main><script>const c=document.getElementById('calendar'),days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];c.innerHTML=days.map(x=>`<div class="calendar-weekday">${x}</div>`).join('')+Array.from({length:6},()=>'<div></div>').join('')+Array.from({length:31},(_,i)=>{const d=i+1,w=new Date(2026,7,d).getDay(),free=w===0||w===6,double=d===15;return `<div class="calendar-day ${double?'calendar-day--double':free?'calendar-day--free':'calendar-day--work'}"><b>${d}</b><small>${double?'Pago doble':free?'Libre':'Laboral'}</small></div>`}).join('');</script></body></html>
