<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Directorio de empleados | AAA Software</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="styles.css"></head>
<body data-page="directorio">
<div class="portal-shell">
  <aside class="portal-nav" id="portalNav" aria-label="Menú del colaborador"></aside>
  <main class="portal-page" data-title="Directorio de empleados" data-subtitle="Encuentra a tus compañeros por puesto o departamento.">
    <header class="portal-topbar" id="portalTopbar"></header>
    <div class="portal-content">
      <a class="btn-back-home" href="index.html#miPortal"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
      <section class="panel">
        <div class="panel__header"><h2 class="panel__title"><i class="fa-solid fa-address-book"></i> Directorio de empleados</h2></div>
        <div class="panel__body">
          <div class="directory-tools">
            <input id="directorySearch" class="form-input" type="text" placeholder="Buscar por nombre, puesto o departamento...">
            <select id="directoryTeam" class="form-select" aria-label="Filtrar por departamento"><option value="todos">Todos los departamentos</option></select>
            <select id="directoryPosition" class="form-select" aria-label="Filtrar por puesto"><option value="todos">Todos los puestos</option></select>
          </div>
          <p class="directory-count" id="directoryCount"></p>
          <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Nombre completo</th><th>Puesto</th><th>Departamento</th><th>Teléfono de oficina</th><th>Extensión</th><th>Correo</th></tr></thead><tbody id="directoryBody"></tbody></table></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel__header"><h2 class="panel__title"><i class="fa-solid fa-sitemap"></i> Organigrama de la empresa</h2></div>
        <div class="panel__body">
          <div class="org-chart">
            <div class="org-node org-node--root">Gerencia General</div>
            <div class="org-chart__grid">
              <div class="org-node">Tecnología</div>
              <div class="org-node">Ventas</div>
              <div class="org-node">Recursos Humanos</div>
              <div class="org-node">Finanzas</div>
              <div class="org-node">Operaciones</div>
              <div class="org-node">Marketing</div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="node_modules/i18next/dist/umd/i18next.min.js"></script>
<script src="i18n.js"></script>
<script src="portal.js"></script>

    { name: 'Rebeca Mora', position: 'Diseñadora gráfica', dept: 'Marketing', phone: '2244-3328', ext: 'Ext. 128', email: 'rebeca.mora@aaa.com' },
    { name: 'Alonso Vega', position: 'Especialista SEO', dept: 'Marketing', phone: '2244-3329', ext: 'Ext. 129', email: 'alonso.vega@aaa.com' },
    { name: 'Daniela Solís', position: 'Redactora de contenido', dept: 'Marketing', phone: '2244-3330', ext: 'Ext. 130', email: 'daniela.solis@aaa.com' }
  ];
  const departments = ['Tecnología', 'Ventas', 'Recursos Humanos', 'Finanzas', 'Operaciones', 'Marketing'];
  const positionsFor = (dept) => dept === 'todos' ? [...new Set(directory.map((p) => p.position))] : [...new Set(directory.filter((p) => p.dept === dept).map((p) => p.position))];
  const deptsFor = (position) => position === 'todos' ? departments : [...new Set(directory.filter((p) => p.position === position).map((p) => p.dept))];
  const renderDirectory = () => {
    const t = window.AAA.t;
    const query = document.getElementById('directorySearch').value.trim().toLowerCase();
    const dept = document.getElementById('directoryTeam').value;
    const position = document.getElementById('directoryPosition').value;
    const rows = directory.filter((p) => (dept === 'todos' || p.dept === dept) && (position === 'todos' || p.position === position) && (!query || `${p.name} ${p.position} ${p.dept}`.toLowerCase().includes(query)));
    document.getElementById('directoryCount').innerHTML = t('Mostrando {{n}} de {{total}} colaboradores').replace('{{n}}', rows.length).replace('{{total}}', directory.length);
    document.getElementById('directoryBody').innerHTML = rows.length ? rows.map((p) => `<tr><td>${window.AAA.esc(p.name)}</td><td>${window.AAA.esc(t(p.position))}</td><td>${t(p.dept)}</td><td>${window.AAA.esc(p.phone)}</td><td>${window.AAA.esc(p.ext)}</td><td>${window.AAA.esc(p.email)}</td></tr>`).join('') : '<tr class="empty-row"><td colspan="6">' + t('No hay resultados.') + '</td></tr>';
  };
  const fillSelects = (changed = null) => {
    const t = window.AAA.t;
    const esc = window.AAA.esc;
    const deptSelect = document.getElementById('directoryTeam');
    const positionSelect = document.getElementById('directoryPosition');
    const dept = deptSelect.value;
    const position = positionSelect.value;
    if (changed !== 'position') {
      const posOptions = positionsFor(dept);
      positionSelect.innerHTML = '<option value="todos">' + t('Todos los puestos') + '</option>' + posOptions.map((p) => `<option value="${esc(p)}">${esc(t(p))}</option>`).join('');
      if (!posOptions.includes(position)) positionSelect.value = 'todos';
    }
    if (changed !== 'dept') {
      const deptOptions = deptsFor(position);
      deptSelect.innerHTML = '<option value="todos">' + t('Todos los departamentos') + '</option>' + deptOptions.map((d) => `<option value="${esc(d)}">${t(d)}</option>`).join('');
      if (!deptOptions.includes(dept)) deptSelect.value = 'todos';
    }
  };
  window.renderPage = () => { fillSelects(); renderDirectory(); };
  ['input', 'change'].forEach((eventName) => document.getElementById('directorySearch').addEventListener(eventName, renderDirectory));
  document.getElementById('directoryTeam').addEventListener('change', () => { fillSelects('dept'); renderDirectory(); });
  document.getElementById('directoryPosition').addEventListener('change', () => { fillSelects('position'); renderDirectory(); });
</script>
</body></html>
