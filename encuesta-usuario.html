<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mi encuesta | AAA Software</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="styles.css"></head>
<body data-page="encuesta">
<div class="portal-shell">
  <aside class="portal-nav" id="portalNav" aria-label="Menú del colaborador"></aside>
  <main class="portal-page" data-title="Encuesta de satisfacción" data-subtitle="Tu opinión ayuda a mejorar AAA Software.">
    <header class="portal-topbar" id="portalTopbar"></header>
    <div class="portal-content">
      <a class="btn-back-home" href="index.html#miPortal"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
      <section class="panel survey-panel">
        <div class="panel__body">
          <form id="survey">
            <div id="questions" class="survey-questions"></div>
            <div class="form-group"><label for="comment">Comentario opcional</label><textarea id="comment" class="form-input form-textarea"></textarea></div>
            <button class="btn-action btn-action--primary"><i class="fa-solid fa-paper-plane"></i> Enviar encuesta</button>
          </form>
          <p id="message" class="justification-status">Tu respuesta será confidencial.</p>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="node_modules/i18next/dist/umd/i18next.min.js"></script>
<script src="i18n.js"></script>
<script src="portal.js"></script>
<script>
  const questions = ['Claridad de las tareas', 'Ambiente laboral', 'Comunicación con administración', 'Herramientas de trabajo'];
  window.renderPage = () => {
    const t = window.AAA.t;
    document.getElementById('questions').innerHTML = questions.map((q, i) => `<fieldset class="survey-question"><legend>${i + 1}. ${t(q)}</legend><div class="rating-options">${[1, 2, 3, 4, 5].map((n) => `<label class="rating-option"><input type="radio" required name="q${i}" value="${n}"><span><i class="fa-solid fa-star"></i>${n}</span></label>`).join('')}</div></fieldset>`).join('');
  };
  document.getElementById('survey').addEventListener('submit', (event) => {
    event.preventDefault();
    if (!event.currentTarget.checkValidity()) return event.currentTarget.reportValidity();
    document.getElementById('message').textContent = window.AAA.t('Encuesta enviada correctamente. ¡Gracias!');
    event.currentTarget.reset();
    window.AAA.showToast(window.AAA.t('Encuesta enviada.'));
  });
</script>
</body></html>
