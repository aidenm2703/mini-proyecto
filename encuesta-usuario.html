<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mi encuesta | AAA Software</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="styles.css"></head>
<body><main class="standalone-page"><header class="standalone-header"><img src="logo.jpeg" alt="AAA Software"><div><p class="eyebrow">PORTAL DEL COLABORADOR</p><h1>Encuesta de satisfacción</h1><p>Tu opinión ayuda a mejorar AAA Software.</p></div><label class="language-picker" for="languageSelect" title="Cambiar idioma"><i class="fa-solid fa-language"></i><select id="languageSelect" aria-label="Cambiar idioma"><option value="es">ES</option><option value="en">EN</option></select></label><a class="btn-action btn-action--secondary" href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver</a></header><section class="panel survey-panel"><div class="panel__body"><form id="survey"><div id="questions" class="survey-questions"></div><div class="form-group"><label for="comment">Comentario opcional</label><textarea id="comment" class="form-input form-textarea"></textarea></div><button class="btn-action btn-action--primary"><i class="fa-solid fa-paper-plane"></i> Enviar encuesta</button></form><p id="message" class="justification-status">Tu respuesta será confidencial.</p></div></section></main><script src="node_modules/i18next/dist/umd/i18next.min.js"></script><script src="i18n.js"></script><script>window.AAAI18n?.ready?.then(()=>{const s=document.getElementById('languageSelect');if(!s)return;s.value=localStorage.getItem('aaa_language')==='en'?'en':'es';s.addEventListener('change',e=>window.AAAI18n.setLanguage(e.target.value));});</script><script>const qs=['Claridad de las tareas','Ambiente laboral','Comunicación con administración','Herramientas de trabajo'];document.getElementById('questions').innerHTML=qs.map((q,i)=>`<fieldset class="survey-question"><legend>${i+1}. ${q}</legend><div class="rating-options">${[1,2,3,4,5].map(n=>`<label class="rating-option"><input type="radio" required name="q${i}" value="${n}"><span><i class="fa-solid fa-star"></i>${n}</span></label>`).join('')}</div></fieldset>`).join('');document.getElementById('survey').addEventListener('submit',e=>{e.preventDefault();if(!e.currentTarget.checkValidity())return e.currentTarget.reportValidity();document.getElementById('message').textContent='Encuesta enviada correctamente. ¡Gracias!';e.currentTarget.reset();});</script></body></html>
